name: Build StreamVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project ZIP
        run: |
          unzip -q StreamVault-v4-real-downloader-project.zip -d extracted

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("extracted/StreamVault-v4/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "android {\n",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
              1
          )

          s = s.replace(
              "    }\n}\ndependencies {",
              """    }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {""",
              1
          )

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build APK
        run: |
          cd extracted/StreamVault-v4
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVault-APK
          path: extracted/StreamVault-v4/app/build/outputs/apk/debug/app-debug.apk
